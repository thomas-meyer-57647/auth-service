AUTH_CONTEXT_PATH=
AUTH_SWAGGER_UI_PATH=/swagger-ui.html
AUTH_API_DOCS_PATH=/api-docs
AUTH_JWKS_PATH=/.well-known/jwks.json
AUTH_ACTUATOR_BASE_PATH=/actuator
AUTH_INTERNAL_API_KEY=internal-test-key
AUTH_SERVER_PORT=0
AUTH_MANAGEMENT_SERVER_PORT=0

spring.application.name=auth-service-test

spring.datasource.url=jdbc:h2:mem:auth_test;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

auth.google.login.enabled=true
auth.facebook.login.enabled=true
auth.google.client-id=test-google-client
auth.facebook.app-id=test-fb-app
auth.facebook.app-secret=test-fb-secret

auth.jwt.service-token-ttl=PT5M
auth.jwt.service-token-max-ttl=PT5M

auth.rate-limit.default-max-requests=10
auth.rate-limit.default-window=30s
auth.rate-limit.endpoints.login.max-requests=2
auth.rate-limit.endpoints.mfa-verify.max-requests=1
auth.rate-limit.endpoints.password-forgot.max-requests=2
auth.rate-limit.endpoints.password-reset.max-requests=2
auth.rate-limit.endpoints.registration-start.max-requests=2
auth.rate-limit.endpoints.registration-social-google.max-requests=1
auth.rate-limit.endpoints.registration-social-facebook.max-requests=1
auth.rate-limit.endpoints.mfa-recovery-start.max-requests=1
auth.rate-limit.endpoints.mfa-recovery-confirm.max-requests=1
