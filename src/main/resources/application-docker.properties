spring.datasource.url=jdbc:mariadb://${AUTH_DB_HOST:mariadb}:${AUTH_DB_PORT:3306}/${AUTH_DB_NAME:auth}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

server.port=${AUTH_SERVER_PORT:8080}
management.server.port=${AUTH_MANAGEMENT_SERVER_PORT:8201}
server.servlet.context-path=${AUTH_CONTEXT_PATH:/api/v1}
management.endpoints.web.base-path=${AUTH_ACTUATOR_BASE_PATH:/actuator}

auth.google.login.enabled=${AUTH_GOOGLE_LOGIN_ENABLED:false}
auth.google.client-id=${AUTH_GOOGLE_CLIENT_ID:}
auth.google.client-secret=${AUTH_GOOGLE_CLIENT_SECRET:}
auth.google.tokeninfo-url=${AUTH_GOOGLE_TOKENINFO_URL:https://oauth2.googleapis.com/tokeninfo}
auth.google.userinfo-url=${AUTH_GOOGLE_USERINFO_URL:https://www.googleapis.com/oauth2/v3/userinfo}

auth.facebook.login.enabled=${AUTH_FACEBOOK_LOGIN_ENABLED:false}
auth.facebook.app-id=${AUTH_FACEBOOK_APP_ID:}
auth.facebook.app-secret=${AUTH_FACEBOOK_APP_SECRET:}
auth.facebook.userinfo-url=${AUTH_FACEBOOK_USERINFO_URL:https://graph.facebook.com/me}
auth.facebook.api-version=${AUTH_FACEBOOK_API_VERSION:v17.0}
