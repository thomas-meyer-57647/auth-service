spring.application.name=auth-service

server.port=${AUTH_SERVER_PORT:8101}
management.server.port=${AUTH_MANAGEMENT_SERVER_PORT:8201}
server.servlet.context-path=${AUTH_CONTEXT_PATH:/api/v1}

spring.datasource.url=jdbc:mariadb://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:3306}/${AUTH_DB_NAME:auth}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=${AUTH_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.api-docs.path=${AUTH_API_DOCS_PATH:/api-docs}
management.endpoints.web.base-path=${AUTH_ACTUATOR_BASE_PATH:/actuator}

auth.jwks.path=${AUTH_JWKS_PATH:/.well-known/jwks.json}
auth.internal.api-key=${AUTH_INTERNAL_API_KEY:}
