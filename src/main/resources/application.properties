spring.application.name=auth-service

server.port=${AUTH_SERVER_PORT:8101}
management.server.port=${AUTH_MANAGEMENT_SERVER_PORT:8201}
server.servlet.context-path=${AUTH_CONTEXT_PATH:/api/v1}

spring.datasource.url=jdbc:mariadb://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:3306}/${AUTH_DB_NAME:auth}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=${AUTH_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.api-docs.path=${AUTH_API_DOCS_PATH:/api-docs}
management.endpoints.web.base-path=${AUTH_ACTUATOR_BASE_PATH:/actuator}

auth.jwks.path=${AUTH_JWKS_PATH:/.well-known/jwks.json}
auth.internal.api-key=${AUTH_INTERNAL_API_KEY:}

auth.google.login.enabled=${AUTH_GOOGLE_LOGIN_ENABLED:false}
auth.google.client-id=${AUTH_GOOGLE_CLIENT_ID:}
auth.google.client-secret=${AUTH_GOOGLE_CLIENT_SECRET:}
auth.google.tokeninfo-url=${AUTH_GOOGLE_TOKENINFO_URL:https://oauth2.googleapis.com/tokeninfo}
auth.google.userinfo-url=${AUTH_GOOGLE_USERINFO_URL:https://www.googleapis.com/oauth2/v3/userinfo}

auth.facebook.login.enabled=${AUTH_FACEBOOK_LOGIN_ENABLED:false}
auth.facebook.app-id=${AUTH_FACEBOOK_APP_ID:}
auth.facebook.app-secret=${AUTH_FACEBOOK_APP_SECRET:}
auth.facebook.userinfo-url=${AUTH_FACEBOOK_USERINFO_URL:https://graph.facebook.com/me}
auth.facebook.api-version=${AUTH_FACEBOOK_API_VERSION:v17.0}

auth.jwt.service-token-ttl=PT5M
auth.jwt.service-token-max-ttl=PT5M

auth.rate-limit.default-max-requests=${AUTH_RATE_LIMIT_DEFAULT_MAX:20}
auth.rate-limit.default-window=${AUTH_RATE_LIMIT_DEFAULT_WINDOW:60s}
auth.rate-limit.endpoints.login.max-requests=${AUTH_RATE_LIMIT_LOGIN:5}
auth.rate-limit.endpoints.mfa-verify.max-requests=${AUTH_RATE_LIMIT_MFA_VERIFY:5}
auth.rate-limit.endpoints.password-forgot.max-requests=${AUTH_RATE_LIMIT_PASSWORD_FORGOT:3}
auth.rate-limit.endpoints.password-reset.max-requests=${AUTH_RATE_LIMIT_PASSWORD_RESET:3}
auth.rate-limit.endpoints.registration-start.max-requests=${AUTH_RATE_LIMIT_REGISTRATION_START:3}
auth.rate-limit.endpoints.registration-social-google.max-requests=${AUTH_RATE_LIMIT_REGISTRATION_SOCIAL_GOOGLE:3}
auth.rate-limit.endpoints.registration-social-facebook.max-requests=${AUTH_RATE_LIMIT_REGISTRATION_SOCIAL_FACEBOOK:3}
auth.rate-limit.endpoints.mfa-recovery-start.max-requests=${AUTH_RATE_LIMIT_MFA_RECOVERY_START:3}
auth.rate-limit.endpoints.mfa-recovery-confirm.max-requests=${AUTH_RATE_LIMIT_MFA_RECOVERY_CONFIRM:3}
